const CATS=RAW.map(([n,b,s])=>({n,b,u:s.split(",").map(x=>{const a=x.split(":");return{s:a[0],n:a[1],f:+a[2]}})}));
const find=(c,t)=>{t=t.trim().toLowerCase();const cand=[t];if(t.endsWith("s"))cand.push(t.slice(0,-1));if(t.endsWith("es"))cand.push(t.slice(0,-2));
for(const w of cand){let u=c.u.find(x=>x.s==w);if(u)return u.s;u=c.u.find(x=>x.n.split("(")[0].trim().toLowerCase()==w);if(u)return u.s;if(AL[w]&&c.u.find(x=>x.s==AL[w]))return AL[w]}return null};
const toC=(v,u)=>u=="c"?v:u=="f"?(v-32)*5/9:u=="k"?v-273.15:(v-491.67)*5/9;
const fromC=(v,u)=>u=="c"?v:u=="f"?v*9/5+32:u=="k"?v+273.15:(v+273.15)*9/5;
const U=(c,s)=>c.u.find(x=>x.s==s);
function conv(c,v,a,b){if(c.n=="Temperature"){const k=toC(v,a);if(k<-273.15)throw Error("Temperature is below absolute zero!");return fromC(k,b)}return v*U(c,a).f/U(c,b).f}
function fmt(x){if(x==0)return"0";const a=Math.abs(x);if(a>=1e-6&&a<1e12){const e=Math.floor(Math.log10(a)),d=Math.min(Math.max(P-1-e,0),100);let t=x.toFixed(d);if(t.includes("."))t=t.replace(/0+$/,"").replace(/\.$/,"");return t}return x.toExponential(P-1).replace(/\.?0+e/,"e")}

function record(c,v,a,b){const r=conv(c,v,a,b),t=`${fmt(v)} ${a} = ${fmt(r)} ${b}   [${c.n}]`;H.push(t);renderHist();return{r,t}}
const resBox=(c,v,a,b)=>{try{const{r}=record(c,v,a,b);return`<div class="res"><div class="mut">${fmt(v)} ${U(c,a).n} =</div><div class="big">${fmt(r)} ${b}</div><div class="mut">${U(c,a).n} → ${U(c,b).n} · ${c.n}</div></div>`}catch(e){return`<div class="res no">${e.message}</div>`}};

Plane angle|theta|radian|rad||theta = arc / radius|1|degree

Absorbed dose|D|gray|Gy|L2T-2|D = energy / mass|7|rad

const SY=["M","L","T","A","K","mol","cd"],ORD=["M","L","T","A","K","mol","cd"];
const parseD=s=>{const a=[0,0,0,0,0,0,0];for(const m of s.matchAll(/(mol|cd|[MLTAK])(-?\d+)/g))a[ORD.indexOf(m[1])]=+m[2];return a};
const dS=a=>"["+a.map((p,i)=>i<3||p?SY[i]+"^"+p:"").filter(Boolean).join(" ")+"]";
const Q=PD.split("\n").map(l=>{const f=l.split("|"),n=f[0].split("~");return{name:n[0],al:n.slice(1),sym:f[1],un:f[2],us:f[3],d:parseD(f[4]),f:f[5],t:+f[6],cgs:f[7]}});
const same=(a,b)=>a.join()==b.join(),norm=t=>t.toLowerCase().replace(/'/g,"").replace(/[?,]/g," ").replace(/\s+/g," ").trim();
const FILL=new Set("what is the unit units of dimension dimensions dimensional formula formulas si for a an in tell me about find give its are cgs show".split(" "));
function search(t){const tk=norm(t).split(" ").filter(Boolean);let k=tk.filter(w=>!FILL.has(w));if(!k.length)k=tk;const q=k.join(" ");if(!q)return[];
const ex=[],pa=[];for(const x of Q){const names=[x.name,...x.al].map(norm),uk=[norm(x.un),norm(x.us)];if(names.includes(q)||uk.includes(q))ex.push(x);else if(names.concat(uk[0]).some(n=>k.every(w=>n.includes(w))))pa.push(x)}return ex.length?ex:pa}
const ul=x=>x.us=="-"?"no unit":`${x.un} (${x.us})`;
const det=x=>{const s=Q.filter(o=>o!==x&&same(o.d,x.d)).map(o=>o.name);return`<div class="d"><div style="font-size:20px;color:#f472b6;font-weight:700">${x.name} <span class="mut" style="min-width:0">(symbol: ${x.sym})</span></div><div><span>SI unit</span><em>${ul(x)}</em></div><div><span>Dimensional formula</span><em>${dS(x.d)}</em></div><div><span>CGS unit</span>${x.cgs}</div><div><span>Formula / Meaning</span>${x.f}</div><div><span>Topic</span>${TOP[x.t]}</div>${s.length?`<div><span>Same dimensions as</span>${s.join(", ")}</div>`:""}</div>`};
const tbl=a=>`<div class="sc"><table><tr><th>Quantity</th><th>SI unit</th><th>Dimension</th></tr>${a.map(x=>`<tr class="r" data-n="${x.name}"><td>${x.name}</td><td>${x.us}</td><td>${dS(x.d)}</td></tr>`).join("")}</table></div>`;
// ---------- 5 finder ----------
$("#finder").innerHTML=`<label>Ask: force | unit of torque | N | joule | dimension of power</label><input id="fi" placeholder="Search a physics quantity..."><div id="fr"></div>`;
function fnd(){const t=$("#fi").value,r=t.trim()?search(t):[];$("#fr").innerHTML=!t.trim()?"":!r.length?`<div class="res no">Not found. Try another name or browse topics.</div>`:r.length<=3?r.map(det).join(""):`<p class="mut">${r.length} matches — click one:</p>`+tbl(r)}
$("#fi").oninput=fnd;$("#fr").onclick=e=>{const tr=e.target.closest("tr.r");if(tr){$("#fi").value=tr.dataset.n;fnd()}};
function openQ(n){go("finder");$("#fi").value=n;fnd()}
// ---------- 6 browse ----------
$("#browse").innerHTML=`<div class="chips">${TOP.map((t,i)=>`<button class="chip${i?"":" on"}" data-i="${i}">${t}</button>`).join("")}<button class="chip" data-i="8">Show EVERYTHING</button></div><div id="br"></div><p class="mut">Click any row for full details, CGS unit and formula.</p>`;
function brw(i){$("#br").innerHTML=i==8?TOP.map((t,j)=>`<h3 style="color:#fb923c">${t}</h3>`+tbl(Q.filter(x=>x.t==j))).join(""):tbl(Q.filter(x=>x.t==i))}
$("#browse").querySelector(".chips").onclick=e=>{if(e.target.dataset.i){e.currentTarget.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c==e.target));brw(+e.target.dataset.i)}};
$("#br").onclick=e=>{const tr=e.target.closest("tr.r");if(tr)openQ(tr.dataset.n)};brw(0);
// ---------- 7 dimension calc ----------
$("#dimcalc").innerHTML=`<datalist id="dl">${Q.map(x=>`<option value="${x.name}">`).join("")}</datalist><p class="mut">Multiply or divide two quantities. Example: Force × Length = [M^1 L^2 T^-2] (Work / Energy)</p>
<div class="g" style="grid-template-columns:1fr 90px 1fr"><div><label>First</label><input id="d1" list="dl" value="Force"></div><div><label>Op</label><select id="do"><option>×</option><option>÷</option></select></div><div><label>Second</label><input id="d2" list="dl" value="Length"></div></div><div id="dr"></div>`;
function dc(){const a=search($("#d1").value)[0],b=search($("#d2").value)[0];if(!a||!b){$("#dr").innerHTML=`<div class="res no">Quantity not found.</div>`;return}
const m=$("#do").value=="×"?1:-1,ans=a.d.map((p,i)=>p+m*b.d[i]),mt=Q.filter(x=>same(x.d,ans)).map(x=>x.name);
$("#dr").innerHTML=`<div class="res"><div class="mut">${a.name} ${dS(a.d)} ${$("#do").value} ${b.name} ${dS(b.d)}</div><div class="big">${dS(ans)}</div><div class="mut">${mt.length?"Belongs to: "+mt.join(", "):"No quantity in our list has this dimension."}</div></div>`}
["d1","d2","do"].forEach(i=>$("#"+i).oninput=dc);dc();
// ---------- 8 quiz ----------
let qz={n:0,s:0,t:5,cur:null};
function quizStart(){qz={n:0,s:0,t:+$("#qn").value||5,cur:null};nextQ()}
$("#quiz").innerHTML=`<div class="g" style="grid-template-columns:120px auto"><div><label>Questions</label><input id="qn" type="number" min="1" max="20" value="5"></div><div><button class="btn" id="qs">Start Quiz</button></div></div><div id="qa"></div>`;
$("#qs").onclick=quizStart;
function nextQ(){if(qz.n>=qz.t){const p=qz.s*100/qz.t;$("#qa").innerHTML=`<div class="res"><div class="big">${qz.s} / ${qz.t}</div><div class="mut">${p==100?"Perfect! You really know your units!":p>=60?"Good job! Keep practising.":"Revise from the Browse tab and try again."}</div></div>`;return}
const pool=Q.filter(x=>x.us!="-"),q=R(pool),isU=Math.random()<.5;let corr,wr;
if(isU){corr=ul(q);wr=[...new Set(pool.map(ul))]}else{corr=dS(q.d);wr=[...new Set(Q.map(x=>dS(x.d)))]}
wr=wr.filter(x=>x!=corr).sort(()=>Math.random()-.5).slice(0,3);const o=[...wr,corr].sort(()=>Math.random()-.5);qz.n++;qz.cur=corr;
$("#qa").innerHTML=`<p class="mut">Question ${qz.n} / ${qz.t} · Score ${qz.s}</p><div class="q">${isU?"SI unit of":"Dimensional formula of"} <span style="color:#f87171">${q.name}</span>?</div>${o.map(x=>`<button class="chip opt">${x}</button>`).join("")}`}
$("#qa").onclick=e=>{if(!e.target.classList.contains("opt")||qz.lock)return;qz.lock=1;const ok=e.target.textContent==qz.cur;if(ok)qz.s++;e.target.classList.add(ok?"ok":"no");
if(!ok)[...document.querySelectorAll(".opt")].find(b=>b.textContent==qz.cur).classList.add("ok");setTimeout(()=>{qz.lock=0;nextQ()},900)};
// ---------- 9 history ----------
function renderHist(){$("#history").innerHTML=`<div class="chips"><button class="btn o" id="hcl">Clear</button><button class="btn" id="hsv">Save as .txt</button></div>`+(H.length?H.map((h,i)=>`<div class="hi"><span class="mut">${i+1}.</span> ${h}</div>`).join(""):`<p class="mut">No history yet.</p>`);
$("#hcl").onclick=()=>{H=[];renderHist()};$("#hsv").onclick=()=>{if(!H.length)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([H.join("\n")],{type:"text/plain"}));a.download="conversion_history.txt";a.click()}}
const HELP=[["convert","Convert","#a78bfa","Pick a category (Length, Mass, Force...), type a value, then choose From and To units. The result updates live as you type. Use ⇄ to swap units, and 'Convert to ALL units' to see the value in every unit of that category."],["quick","Quick","#22d3ee","Type one line like '5 feet to inches', '150 lb to kg' or '100 c to f' and press Enter. You can use symbols (km) or names (kilometer, feet, inches)."],["popular","Popular","#34d399","Tap one of 32 common conversions (lb to kg, ft to in, C to F...), enter your value, and the answer appears instantly."],["height","Height","#fbbf24","Enter feet and inches to get cm and meters, or enter centimeters to get feet and inches."],["finder","Physics Finder","#f472b6","Search any physics quantity or unit: 'force', 'unit of torque', 'N', 'joule', 'dimension of power'. You get the SI unit, dimensional formula, CGS unit, formula, and other quantities with the same dimensions. If many results match, click one to open its details."],["browse","Browse","#fb923c","Pick a topic (Mechanics, Electricity, Modern Physics...) to see all its quantities with units and dimensions. Click any row for full details."],["dimcalc","Dimension Calc","#60a5fa","Choose two quantities and × or ÷. You get the resulting dimension and which quantity it matches. Example: Force × Length = Work / Energy."],["quiz","Quiz","#f87171","Choose how many questions (1-20), press Start, and pick the right option for SI units and dimensional formulas. Your score is shown at the end."],["history","History","#c084fc","Every conversion is saved here during your session. You can clear it or download it as a .txt file."]];
$("#help").innerHTML=`<h2 style="margin:0 0 4px;color:#38bdf8">How to use</h2><p class="mut">Each tab does one job. Tap a card to open that tab.</p><div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${HELP.map(h=>`<div class="cd" data-go="${h[0]}" style="cursor:pointer;border-color:${h[2]}55"><b style="color:${h[2]};font-size:16px">${h[1]}</b><span style="color:#cfcfe0;font-size:14px">${h[3]}</span></div>`).join("")}</div><div class="d" style="margin-top:16px"><div style="color:#fbbf24;font-weight:700">Tips</div><div>• Precision (bottom of the page) sets significant digits, 1 to 15.</div><div>• Temperature below absolute zero (-273.15 C) shows an error.</div><div>• In Digital Storage, 1 KB = 1024 bytes.</div><div>• Units must be from the same category (you can't convert kg to meters).</div></div>`;
$("#help").onclick=e=>{const c=e.target.closest("[data-go]");if(c)go(c.dataset.go)};
renderHist();go("convert");
</script></body></html>
